[project]
name = "time_series_forecasting"
version = "0.1.0"
description = "Course materials for time series forecasting: data exploration, ARIMA modeling, and AutoML with AutoGluon, using energy and production datasets."
requires-python = "==3.11.*"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.0.0",
    "statsmodels>=0.14.0",
    "pmdarima>=2.0.0",
    "scikit-learn>=1.3.0",
    "autogluon.timeseries>=1.0.0",
    "ydata-profiling>=4.5.0",
]
